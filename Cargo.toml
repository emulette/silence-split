[package]
name = "silence-split"
description = "Split long PCM audio into pieces at silence without exceeding a maximum length"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emulette/silence-split"
documentation = "https://docs.rs/silence-split"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
keywords = ["audio", "silence", "split", "segmentation", "vad"]
categories = ["multimedia::audio", "algorithms"]

[features]
default = ["std"]
std = ["serde?/std"]

[dependencies]
libm = { version = "0.2.16", optional = true }
serde = { version = "1.0.229", optional = true, default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
serde_json = "1.0.151"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
