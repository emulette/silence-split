name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ref:
    name: Validate the release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject refs that are not a vMAJOR.MINOR.PATCH tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/v[0-9]*.[0-9]*.[0-9]*) ;;
            *) printf 'not a release tag: %s\n' "$RELEASE_REF" >&2; exit 1 ;;
          esac

      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Publishing reads the version from the manifest, not from the tag, so a tag that disagrees
      # with it would ship the wrong version under the right name. crates.io never lets a version
      # number be reused, so nothing downstream can undo that.
      - name: Require the tag to match the package version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          tagged="${RELEASE_REF#refs/tags/v}"
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tagged" != "$declared" ]; then
            printf '::error::tag v%s does not match the package version %s\n' \
              "$tagged" "$declared"
            exit 1
          fi
          printf 'releasing version %s\n' "$declared"

      # The GitHub release notes are this section, so an undated or missing entry fails here
      # instead of after the crate is already on the registry.
      - name: Require a dated changelog entry for the version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if ! grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md; then
            printf '::error::CHANGELOG.md has no dated "## [%s] - YYYY-MM-DD" heading\n' "$version"
            exit 1
          fi

  core:
    name: Verification
    needs: release-ref
    uses: ./.github/workflows/ci.yml

  # The environment is where a required reviewer belongs: an upload cannot be undone.
  #
  # Re-run safe: the crate is skipped when crates.io already serves this version.
  publish-crates-io:
    name: Publish the crate to crates.io
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      # Exchanges this job's OIDC identity for a token that expires in 30 minutes and is revoked
      # when the job ends, so no registry credential is stored in the repository.
      - name: Mint a short-lived crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # A probe failure leaves the crate unpublished: publishing stays the authoritative act and at
      # worst reproduces the duplicate-version error.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if response="$(curl --fail --silent --show-error \
            --header 'User-Agent: silence-split-release (https://github.com/emulette/silence-split)' \
            "https://crates.io/api/v1/crates/silence-split/versions")" &&
            printf '%s' "$response" | jq --exit-status --arg version "$version" \
              'any(.versions[]; .num == $version)' >/dev/null; then
            printf 'silence-split %s is already on crates.io; skipping\n' "$version"
            exit 0
          fi
          cargo publish --locked

  # A GitHub release can be edited or deleted, unlike a registry upload, so it needs no reviewer.
  github-release:
    name: Publish the GitHub release
    needs: publish-crates-io
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Publish the release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'release %s already exists; skipping\n' "$RELEASE_TAG"
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag
