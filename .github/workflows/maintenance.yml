name: Maintenance

# Manual only. The advisory database is an input this repository does not control, so a push tier
# would redden unchanged commits and an unchanged tag could stop publishing. Dispatch it before
# tagging a release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: true

jobs:
  advisories:
    name: Fresh advisory database check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check the workspace against today's advisories
        run: cargo deny --locked --all-features check advisories
